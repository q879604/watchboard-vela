# Release：推 v* 标签（或手动触发）→ 构建 rpk 并发布到 GitHub Release
#
# 签名（可选，证书绝不提交仓库）：
#   本地：tar -czf sign.tar.gz sign/ && base64 -w0 sign.tar.gz
#   粘贴到 仓库 Settings → Secrets and variables → Actions，名称 SIGN_ARCHIVE
#   未配置时自动退回 debug 包（toolkit 内置调试证书签名，可直接安装到手表）
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已推送到远端），例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Restore signing keys (optional)
        env:
          SIGN_ARCHIVE: ${{ secrets.SIGN_ARCHIVE }}
        run: |
          if [ -n "$SIGN_ARCHIVE" ]; then
            echo "$SIGN_ARCHIVE" | base64 -d | tar -xz -C .
            echo "::notice::已从 SIGN_ARCHIVE 恢复 sign/ 签名目录"
          else
            echo "::warning::未配置 SIGN_ARCHIVE secret，将回退构建 debug 包"
          fi

      - name: Build package
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"
          VERSION="$(node -p "require('./src/manifest.json').versionName")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::warning::tag '$TAG' 与 manifest versionName '$VERSION' 不一致，rpk 文件名以 manifest 为准"
          fi
          # 与 aiot release 的证书查找顺序一致：sign/release/ 优先，其次 sign/
          if { [ -f sign/release/private.pem ] && [ -f sign/release/certificate.pem ]; } || { [ -f sign/private.pem ] && [ -f sign/certificate.pem ]; }; then
            echo "::notice::检测到签名证书，构建 release 包"
            npm run release
          else
            echo "::warning::未检测到签名证书，构建 debug 包"
            npm run build
          fi
          ls -l dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.rpk --clobber
          else
            gh release create "$TAG" dist/*.rpk --generate-notes --title "环上桌游 $TAG"
          fi