# CI：push / PR / 手动触发 → 云端构建 rpk，产出 artifact
# 前提：Node >= 18（aiot-toolkit 2.0 依赖 @inquirer/prompts@5）
# 有 package-lock.json 走 npm ci（可复现），没有则退回 npm install
name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::无 package-lock.json，使用 npm install"
            npm install --no-audit --no-fund
          fi

      - name: Lint (.js)
        run: npm run lint || true

      # .ux 由编译器校验：构建失败即 CI 失败
      - name: Build RPK (aiot build)
        run: npm run build

      - name: Show dist
        run: ls -l dist/ || true

      - name: Upload RPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpk
          path: dist/*.rpk
          if-no-files-found: error